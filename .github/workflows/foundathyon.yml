# Foundathyon Deploy: https://mix-sinapsis.foundathyon.dev
# Needs the repository secret FOUNDATHYON_REGISTRY_TOKEN (Settings > Secrets and variables > Actions)
# with the fdr_... token of the service. Configuring the service from the panel installs both.
name: "Foundathyon Deploy (mix-sinapsis)"

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: "foundathyon-deploy-mix-sinapsis"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fundathyon/deploy-action@v1
        with:
          organization: "sinapsis"
          service: "sinapsis-v2"
          token: ${{ secrets.FOUNDATHYON_REGISTRY_TOKEN }}
          registry: "registry.foundathyon.dev"
          url: "https://mix-sinapsis.foundathyon.dev"
