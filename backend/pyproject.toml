[project]
name = "selva-backend"
version = "0.1.0"
description = "API de Mix"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "anthropic>=2.14.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
