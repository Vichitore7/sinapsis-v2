<!-- @dsCard group="Retos" height=420 subtitle="Reto del día con contexto cotidiano" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Tarjeta de reto — preview</title></head>
<body>
<div style="padding: var(--espacio-4); max-width: 460px;">
  <div class="sm-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--espacio-3);">
      <span class="sm-chip">Mundo 2 · Reto 3</span>
      <span class="sm-chip sm-chip-sol">★ +3</span>
    </div>
    <h2 style="font-family: var(--font-display); font-weight:800; font-size:22px; line-height:28px; margin:0 0 var(--espacio-2);">Misión en el mercado</h2>
    <p style="font-size:18px; line-height:26px; margin:0 0 var(--espacio-3);">Kiko quiere comprar 3 mangos. Cada uno cuesta $12. ¿Cuánto paga en total?</p>
    <svg viewBox="0 0 310 60" width="310" height="60" role="img" aria-label="3 montones de 12 monedas cada uno" style="display:block; margin: 0 0 var(--espacio-3);"><defs><g id="coin"><circle r="7" style="fill:var(--sol);stroke:var(--tinta);stroke-width:1.5"/><circle r="3.4" style="fill:none;stroke:var(--sol-profundo);stroke-width:1.5"/></g></defs><use href="#coin" x="8" y="8"/><use href="#coin" x="23" y="8"/><use href="#coin" x="38" y="8"/><use href="#coin" x="53" y="8"/><use href="#coin" x="68" y="8"/><use href="#coin" x="83" y="8"/><use href="#coin" x="8" y="23"/><use href="#coin" x="23" y="23"/><use href="#coin" x="38" y="23"/><use href="#coin" x="53" y="23"/><use href="#coin" x="68" y="23"/><use href="#coin" x="83" y="23"/><use href="#coin" x="118" y="8"/><use href="#coin" x="133" y="8"/><use href="#coin" x="148" y="8"/><use href="#coin" x="163" y="8"/><use href="#coin" x="178" y="8"/><use href="#coin" x="193" y="8"/><use href="#coin" x="118" y="23"/><use href="#coin" x="133" y="23"/><use href="#coin" x="148" y="23"/><use href="#coin" x="163" y="23"/><use href="#coin" x="178" y="23"/><use href="#coin" x="193" y="23"/><use href="#coin" x="228" y="8"/><use href="#coin" x="243" y="8"/><use href="#coin" x="258" y="8"/><use href="#coin" x="273" y="8"/><use href="#coin" x="288" y="8"/><use href="#coin" x="303" y="8"/><use href="#coin" x="228" y="23"/><use href="#coin" x="243" y="23"/><use href="#coin" x="258" y="23"/><use href="#coin" x="273" y="23"/><use href="#coin" x="288" y="23"/><use href="#coin" x="303" y="23"/><text x="45" y="52" text-anchor="middle" style="font-family:var(--font-body);font-weight:700;font-size:14px;fill:var(--tinta-suave)">12</text><text x="155" y="52" text-anchor="middle" style="font-family:var(--font-body);font-weight:700;font-size:14px;fill:var(--tinta-suave)">12</text><text x="265" y="52" text-anchor="middle" style="font-family:var(--font-body);font-weight:700;font-size:14px;fill:var(--tinta-suave)">12</text></svg>
    <div style="display:flex; align-items:center; gap: var(--espacio-3); margin-bottom: var(--espacio-4);">
      <span style="font-weight:800; font-size:32px; line-height:40px;">3 × $12 =</span>
      <input class="sm-input" value="" placeholder="?" aria-label="Tu respuesta">
    </div>
    <div style="display:flex; gap: var(--espacio-3); flex-wrap: wrap;">
      <button class="sm-btn">Comprobar</button>
      <button class="sm-btn sm-btn-pista">? Pista</button>
    </div>
  </div>
</div>
</body>
</html>
