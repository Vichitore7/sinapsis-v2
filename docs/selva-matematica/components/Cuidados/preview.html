<!-- @dsCard group="Mascota" height=470 subtitle="Medidores de bienestar, aviso de necesidad y cuidados" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Cuidados — preview</title>
<style>
  .wrap { display: flex; flex-wrap: wrap; gap: var(--espacio-4); padding: var(--espacio-4); align-items: flex-start; }
  .panel { flex: 1 1 340px; max-width: 420px; }
  .panel h2 { font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 28px; margin: 0 0 var(--espacio-3); }
  .fila { display: flex; align-items: center; gap: var(--espacio-3); padding: var(--espacio-2) var(--espacio-3); border: 2px solid var(--tinta); border-radius: var(--radio-sm); background: var(--superficie); margin-bottom: var(--espacio-2); }
  .fila.pide { background: var(--casi-suave); border-color: var(--casi); border-width: 3px; }
  .fila .nombre { flex: 1; font-weight: 800; font-size: 18px; line-height: 26px; }
  .marcas { display: flex; gap: 4px; }
  .marca { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--tinta); background: var(--bloqueado); }
  .marca.on { background: var(--selva); }
  .tag-pide { font-size: 14px; line-height: 20px; font-weight: 800; color: var(--casi-texto); }
  .escena { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: var(--espacio-2); }
  .flota { animation: rebote 1.2s ease-in-out infinite; }
  @keyframes rebote { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .flota { animation: none; } }
  .acciones { display: flex; flex-wrap: wrap; gap: var(--espacio-3); margin-top: var(--espacio-3); }
  .acciones .sm-btn { font-size: 18px; }
  .estrellas { display: inline-flex; align-items: center; gap: var(--espacio-1); }
  svg.o { overflow: visible; }
  .o .w { fill: var(--superficie); stroke: var(--superficie); stroke-width: 12; stroke-linejoin: round; stroke-linecap: round; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="ic-comida"><path d="M8 40 Q16 20 26 40 T44 40 T62 40" fill="none"/></g>
    <g id="ic-popo"><ellipse cx="32" cy="48" rx="24" ry="11"/><ellipse cx="32" cy="34" rx="17" ry="10"/><ellipse cx="34" cy="21" rx="10" ry="8"/></g>
    <g id="ic-juego"><circle cx="32" cy="32" r="22"/></g>
  </defs>
</svg>
<div class="wrap">
  <div class="sm-card panel">
    <h2>Bienestar de Kiko</h2>

    <div class="fila">
      <svg class="o" width="44" height="44" viewBox="0 0 64 64" aria-hidden="true"><use class="w" href="#ic-comida"/><use href="#ic-comida" style="fill:none;stroke:var(--tinta);stroke-width:12;stroke-linecap:round;stroke-linejoin:round"/><use href="#ic-comida" style="fill:none;stroke:var(--ajolote-rosa-profundo);stroke-width:7;stroke-linecap:round;stroke-linejoin:round"/></svg>
      <span class="nombre">Comida</span>
      <span class="marcas" role="img" aria-label="Comida: 4 de 5"><span class="marca on"></span><span class="marca on"></span><span class="marca on"></span><span class="marca on"></span><span class="marca"></span></span>
    </div>

    <div class="fila pide">
      <svg class="o" width="44" height="44" viewBox="0 0 64 64" aria-hidden="true"><use class="w" href="#ic-popo"/><use href="#ic-popo" style="fill:var(--popo);stroke:var(--tinta);stroke-width:2.5"/><circle cx="26" cy="35" r="2.4" style="fill:var(--tinta)"/><circle cx="38" cy="35" r="2.4" style="fill:var(--tinta)"/></svg>
      <span class="nombre">Pecera <span class="tag-pide">· Pide</span></span>
      <span class="marcas" role="img" aria-label="Pecera: 2 de 5"><span class="marca on"></span><span class="marca on"></span><span class="marca"></span><span class="marca"></span><span class="marca"></span></span>
    </div>

    <div class="fila">
      <svg class="o" width="44" height="44" viewBox="0 0 64 64" aria-hidden="true"><use class="w" href="#ic-juego"/><use href="#ic-juego" style="fill:var(--sol);stroke:var(--tinta);stroke-width:2.5"/><path d="M12 24 Q32 36 52 24" style="fill:none;stroke:var(--magia);stroke-width:5;stroke-linecap:round"/><path d="M12 42 Q32 30 52 42" style="fill:none;stroke:var(--magia);stroke-width:5;stroke-linecap:round"/></svg>
      <span class="nombre">Alegría</span>
      <span class="marcas" role="img" aria-label="Alegría: 5 de 5"><span class="marca on"></span><span class="marca on"></span><span class="marca on"></span><span class="marca on"></span><span class="marca on"></span></span>
    </div>

    <div class="acciones">
      <button class="sm-btn"><span class="estrellas">Alimentar · ★ 1</span></button>
      <button class="sm-btn"><span class="estrellas">Jugar · ★ 2</span></button>
      <button class="sm-btn sm-btn-suave">Limpiar · gratis</button>
      <button class="sm-btn sm-btn-suave">Descansar · gratis</button>
    </div>
  </div>

  <div class="escena">
    <div class="flota">
      <svg class="o" width="72" height="72" viewBox="0 0 64 64" role="img" aria-label="Kiko pide que limpies su pecera"><use class="w" href="#ic-popo"/><use href="#ic-popo" style="fill:var(--popo);stroke:var(--tinta);stroke-width:2.5"/><circle cx="26" cy="35" r="2.4" style="fill:var(--tinta)"/><circle cx="38" cy="35" r="2.4" style="fill:var(--tinta)"/></svg>
    </div>
    <svg viewBox="0 0 200 200" width="130" height="130" role="img" aria-label="Ajolote curioso">
      <g style="fill:var(--superficie);stroke:var(--superficie);stroke-width:16;stroke-linejoin:round"><ellipse cx="100" cy="152" rx="36" ry="26"/><ellipse cx="100" cy="100" rx="62" ry="52"/><ellipse cx="38" cy="70" rx="24" ry="9" transform="rotate(-35 38 70)"/><ellipse cx="30" cy="92" rx="24" ry="9" transform="rotate(-5 30 92)"/><ellipse cx="162" cy="70" rx="24" ry="9" transform="rotate(35 162 70)"/><ellipse cx="170" cy="92" rx="24" ry="9" transform="rotate(5 170 92)"/></g>
      <g style="fill:var(--magia);stroke:var(--tinta);stroke-width:2.5"><ellipse cx="38" cy="70" rx="24" ry="9" transform="rotate(-35 38 70)"/><ellipse cx="30" cy="92" rx="24" ry="9" transform="rotate(-5 30 92)"/><ellipse cx="162" cy="70" rx="24" ry="9" transform="rotate(35 162 70)"/><ellipse cx="170" cy="92" rx="24" ry="9" transform="rotate(5 170 92)"/></g>
      <g style="fill:var(--ajolote-rosa);stroke:var(--tinta);stroke-width:2.5"><ellipse cx="100" cy="152" rx="36" ry="26"/><ellipse cx="100" cy="100" rx="62" ry="52"/></g>
      <ellipse cx="62" cy="116" rx="10" ry="6" style="fill:var(--ajolote-rosa-profundo);opacity:.7"/><ellipse cx="138" cy="116" rx="10" ry="6" style="fill:var(--ajolote-rosa-profundo);opacity:.7"/>
      <circle cx="78" cy="102" r="7" style="fill:var(--tinta)"/><circle cx="122" cy="100" r="9" style="fill:var(--tinta)"/><circle cx="81" cy="99" r="2.6" style="fill:var(--superficie)"/><circle cx="125" cy="97" r="3" style="fill:var(--superficie)"/>
      <path d="M112 82 Q122 74 134 80" style="fill:none;stroke:var(--tinta);stroke-width:3;stroke-linecap:round"/><ellipse cx="100" cy="124" rx="6" ry="7" style="fill:var(--tinta)"/>
    </svg>
  </div>
</div>
</body>
</html>
